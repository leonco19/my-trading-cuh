<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Trading Bro</title>
<meta name="theme-color" content="#131f24">
<meta name="description" content="Learn day trading from scratch, game-style. Lessons, quizzes, a trading simulator, a coach and market news.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trading Bro">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#131f24; --bg2:#1a2b33; --bg3:#202f36; --line:#37464f; --text:#f1f7fb; --muted:#8ea3b5;
  --green:#58cc02; --green-d:#46a302; --blue:#1cb0f6; --blue-d:#1899d6; --red:#ff4b4b; --red-d:#d33131;
  --gold:#ffc800; --orange:#ff9600; --purple:#ce82ff;
  --r:16px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{overscroll-behavior:none}
a{color:var(--blue);text-decoration:none}
h1{font-size:1.6rem;font-weight:900;margin:.2em 0 .5em}
h2{font-size:1.2rem;font-weight:800;margin:1.4em 0 .6em}
h3{margin:.2em 0 .4em}
.muted{color:var(--muted)} .small{font-size:.85rem} .good{color:var(--green)} .bad{color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center} .row.end{justify-content:flex-end} .row.center{justify-content:center;margin:16px 0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:760px){.two-col{grid-template-columns:1fr}}

/* buttons */
.btn{font:inherit;font-weight:800;border:2px solid var(--line);border-bottom-width:4px;background:var(--bg2);color:var(--text);padding:10px 18px;border-radius:14px;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;font-size:.85rem;transition:transform .05s,filter .15s}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--green);border-color:var(--green-d);color:#0b1a05}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.danger{background:var(--red);border-color:var(--red-d);color:#fff}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--bg3)}
.btn.big{padding:14px 26px;font-size:1rem}
.btn.sm{padding:6px 12px;font-size:.75rem;border-radius:10px}
.btn.short-btn{background:var(--red);border-color:var(--red-d);color:#fff}
.chip-btn{font:inherit;font-weight:700;font-size:.82rem;border:2px solid var(--line);background:transparent;color:var(--text);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip-btn.on,.chip-btn:hover{border-color:var(--blue);color:var(--blue)}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}

/* picker & onboarding */
body.no-shell{background:radial-gradient(1200px 600px at 50% -10%,#1d3a2a 0%,var(--bg) 60%)}
.picker{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + var(--safe-t)) 20px 24px;text-align:center}
.logo-big{font-weight:900;font-size:1.3rem;color:var(--green);margin-bottom:10px;letter-spacing:.02em}
.profiles{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin:18px 0 28px}
.profile-card{font:inherit;color:var(--text);width:190px;padding:24px 14px;border-radius:22px;border:2px solid var(--line);border-bottom-width:6px;background:var(--bg2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s}
.profile-card:hover{transform:translateY(-4px);border-color:var(--pc)}
.profile-card:active{transform:translateY(2px);border-bottom-width:2px}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:84px;height:84px;font-size:46px;border-radius:50%;background:color-mix(in srgb,var(--pc,#1cb0f6) 25%,transparent);border:3px solid var(--pc,#1cb0f6)}
.avatar.sm{width:40px;height:40px;font-size:22px;border-width:2px}
.avatar.xl{width:110px;height:110px;font-size:60px;margin-bottom:8px}
.pname{font-weight:900;font-size:1.35rem}.psub{font-size:.8rem;color:var(--muted)}
.onboard{display:flex;flex-direction:column;gap:14px;width:min(380px,100%);text-align:left}
.onboard label{display:flex;flex-direction:column;gap:6px;font-weight:700}
.err{color:var(--red);min-height:1.2em;font-weight:700}

/* shell */
#shell{display:flex;height:100vh;height:100dvh}
nav.side{width:230px;flex:none;border-right:2px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
nav.side .logo{font-weight:900;color:var(--green);font-size:1.15rem;padding:6px 12px 18px}
nav.side a{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:12px;color:var(--text);font-weight:800;text-transform:uppercase;font-size:.85rem;letter-spacing:.04em;border:2px solid transparent}
nav.side a:hover{background:var(--bg3)}
nav.side a.on{border-color:var(--blue);background:rgba(28,176,246,.12);color:var(--blue)}
nav.side .ni{font-size:1.35rem}
nav.side .switch{margin-top:auto;color:var(--muted)}
.col{flex:1;display:flex;flex-direction:column;min-width:0}
header.top{display:flex;align-items:center;gap:14px;padding:calc(10px + var(--safe-t)) 18px 10px;border-bottom:2px solid var(--line)}
.who{display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:12px;padding:2px 6px 2px 2px}
.who:hover{background:var(--bg3)}
.lvbar{flex:1;max-width:280px;height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.lvbar div{height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));border-radius:999px;transition:width .4s}
.chips{display:flex;gap:8px;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:4px;font-weight:900;padding:4px 10px;border-radius:999px;background:var(--bg2);border:2px solid var(--line);font-size:.9rem}
.chip.fire{color:var(--orange)} .chip.xp{color:var(--gold)}
main{flex:1;overflow-y:auto;padding:18px 22px calc(40px + var(--safe-b));-webkit-overflow-scrolling:touch}
.page{max-width:900px;margin:0 auto}

@media(max-width:820px){
  #shell{flex-direction:column}
  nav.side{order:2;width:auto;flex-direction:row;border-right:none;border-top:2px solid var(--line);padding:6px 4px calc(6px + var(--safe-b));justify-content:space-around;gap:0;background:var(--bg)}
  nav.side .logo{display:none}
  nav.side a{flex-direction:column;gap:2px;padding:6px 4px;font-size:.6rem;border-radius:10px;flex:1;align-items:center}
  nav.side .switch{display:none}
  .col{order:1;flex:1;min-height:0}
  header.top{padding:calc(8px + var(--safe-t)) 12px 8px;gap:8px}
  .lvbar{display:none}
  .who .muted{display:none}
  main{padding:14px 12px 30px}
  .chip{padding:3px 8px;font-size:.8rem}
}

/* banners */
.banner{padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg2);margin:10px 0;line-height:1.45}
.banner.sim{border-color:var(--purple);background:rgba(206,130,255,.1)}
.banner.warn{border-color:var(--orange);background:rgba(255,150,0,.1)}
.banner.good{border-color:var(--green);background:rgba(88,204,2,.1)}
.banner .bar{margin-top:8px}

/* learn path */
.learn{max-width:620px;margin:0 auto}
.unit{margin-bottom:28px}
.unit-head{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--uc);color:#fff;border-radius:var(--r);padding:16px 18px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.unit-head h2{margin:2px 0;font-size:1.3rem;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.unit-num{font-size:.75rem;font-weight:900;opacity:.85;letter-spacing:.1em}
.unit-sub{opacity:.92;font-weight:600}
.mastery-pill{background:rgba(0,0,0,.25);padding:6px 10px;border-radius:999px;font-weight:900;font-size:.8rem;white-space:nowrap}
.unit.locked .unit-head{filter:grayscale(.85) brightness(.6)}
.path{display:flex;flex-direction:column;align-items:center;gap:20px;padding:26px 0 6px}
.node-wrap{display:flex;flex-direction:column;align-items:center;position:relative}
.node{width:76px;height:70px;border-radius:50%;border:none;font-size:30px;cursor:pointer;background:var(--uc);box-shadow:0 7px 0 color-mix(in srgb,var(--uc) 60%,#000);transition:transform .08s}
.node:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--uc) 60%,#000)}
.node.locked{background:var(--line);box-shadow:0 7px 0 #2a363d;cursor:not-allowed;font-size:24px}
.node.done{background:var(--gold);box-shadow:0 7px 0 #c99b00}
.node.current{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{outline:4px solid transparent;outline-offset:4px}50%{outline:4px solid color-mix(in srgb,var(--uc) 55%,transparent);outline-offset:8px}}
.node-label{margin-top:12px;font-weight:800;font-size:.85rem;text-align:center;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:2px}
.stars{color:var(--gold);letter-spacing:2px}
.grade{font-size:.75rem;color:var(--green)} .grade.bad{color:var(--orange)}
.start-bubble{position:absolute;top:-34px;background:var(--bg);border:2px solid var(--line);color:var(--uc);font-weight:900;padding:4px 12px;border-radius:10px;font-size:.8rem;animation:bob 1.2s ease-in-out infinite;z-index:1}
@keyframes bob{50%{transform:translateY(-4px)}}

/* overlay player */
#overlay{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto}
.player{min-height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.ptop{display:flex;align-items:center;gap:14px;padding:calc(16px + var(--safe-t)) 18px 10px}
.ptop .x{background:none;border:none;color:var(--muted);font-size:1.6rem;cursor:pointer}
.pbar{flex:1;height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.pbar div{height:100%;background:var(--green);border-radius:999px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.ptitle{font-weight:800;color:var(--muted);font-size:.85rem;white-space:nowrap}
@media(max-width:600px){.ptitle{display:none}}
.pbody{flex:1;padding:12px 22px 30px;line-height:1.6;font-size:1.05rem}
.pbody h2{font-size:1.5rem;margin-top:.4em}
.pbody h2.q{font-size:1.35rem}
.learn-html ul,.learn-html ol{padding-left:1.3em}
.learn-html li{margin:.35em 0}
.callout{border-left:5px solid var(--blue);background:rgba(28,176,246,.08);padding:12px 14px;border-radius:10px;margin:12px 0}
.callout.good{border-color:var(--green);background:rgba(88,204,2,.08)}
.rule{background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.formula{font-family:"JetBrains Mono",monospace;background:var(--bg2);border:2px dashed var(--gold);color:var(--gold);padding:12px 14px;border-radius:12px;margin:12px 0;font-weight:700;text-align:center}
.quote-box{display:flex;gap:10px;justify-content:center;margin:12px 0;font-family:"JetBrains Mono",monospace;font-weight:700}
.quote-box span{padding:8px 14px;border-radius:10px}.bid{background:rgba(88,204,2,.15);color:var(--green)}.ask{background:rgba(255,75,75,.15);color:var(--red)}
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.92rem}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
.tbl tr.me td{background:rgba(28,176,246,.08);font-weight:800}
.lesson-chart{width:100%;height:260px;display:block;background:var(--bg2);border-radius:14px;border:2px solid var(--line);margin:10px 0}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opts.tf{flex-direction:row}.opts.tf .opt{flex:1;justify-content:center}
.opt{font:inherit;font-weight:700;text-align:left;display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:transparent;color:var(--text);cursor:pointer}
.opt .k{display:inline-flex;width:26px;height:26px;border:2px solid var(--line);border-radius:8px;align-items:center;justify-content:center;font-size:.8rem;color:var(--muted);flex:none}
.opt:hover:not(:disabled){background:var(--bg3)}
.opt.sel{border-color:var(--blue);background:rgba(28,176,246,.12);color:var(--blue)}
.opt.right{border-color:var(--green);background:rgba(88,204,2,.15);color:var(--green)}
.opt.wrong{border-color:var(--red);background:rgba(255,75,75,.13);color:var(--red)}
.num-in{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:800}
.num-in input{font-size:1.3rem;width:220px}
.retry-tag{display:inline-block;color:var(--orange);font-weight:900;font-size:.8rem;margin-bottom:4px}
.pfoot{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px calc(18px + var(--safe-b));border-top:2px solid var(--line);background:var(--bg)}
.pfoot.ok{background:#1e3b12;border-color:transparent}
.pfoot.bad{background:#3b1a1c;border-color:transparent}
.pfoot .fb{flex:1}
.fb-title{font-weight:900;font-size:1.25rem}
.pfoot.ok .fb-title{color:var(--green)} .pfoot.bad .fb-title{color:var(--red)}
.fb-why{font-size:.92rem;margin-top:2px;line-height:1.4}
.pfoot.bad .btn.primary{background:var(--red);border-color:var(--red-d);color:#fff}
@media(max-width:600px){.pfoot{flex-direction:column;align-items:stretch}.pfoot .btn{width:100%}}
.result{text-align:center;padding:calc(40px + var(--safe-t)) 22px 40px}
.big-emoji{font-size:5rem;animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.stars-big{color:var(--gold);font-size:2.6rem;letter-spacing:6px}
.res-stats{display:flex;gap:12px;justify-content:center;margin:18px 0}
.rs{border:2px solid var(--line);border-radius:14px;padding:10px 18px;min-width:96px;display:flex;flex-direction:column}
.rs b{font-size:1.5rem}.rs span{font-size:.75rem;color:var(--muted);text-transform:uppercase;font-weight:800}
.verdict{font-weight:800;font-size:1.1rem}
.mistakes{text-align:left;max-width:560px;margin:20px auto;background:var(--bg2);border-radius:14px;padding:14px 16px;border:2px solid var(--line)}
.mist{padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}.mist:last-of-type{border:none}

/* review / progress */
.review-hero{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--bg2);border:2px solid var(--line);border-radius:var(--r);padding:20px;flex-wrap:wrap}
.big-num{font-size:3rem;font-weight:900;color:var(--orange);line-height:1}
.weak-list{display:flex;flex-direction:column;gap:8px}
.weak{display:grid;grid-template-columns:1fr 120px 48px auto;gap:12px;align-items:center;background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
@media(max-width:600px){.weak{grid-template-columns:1fr 50px auto}.weak .bar{display:none}}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar div{height:100%;background:var(--green);border-radius:999px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:1.35rem;font-family:"JetBrains Mono",monospace}
.stat span{font-size:.78rem;color:var(--muted);font-weight:700}
.week{display:flex;gap:8px;align-items:flex-end;height:150px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;font-weight:800;font-size:.8rem}
.wbar{flex:1;width:100%;max-width:44px;background:var(--bg2);border-radius:10px;display:flex;align-items:flex-end;overflow:hidden}
.wbar div{width:100%;background:var(--blue);border-radius:10px}.wbar div.hit{background:var(--gold)}
.mastery{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:200px 1fr 90px;gap:12px;align-items:center;font-weight:700}
@media(max-width:600px){.mrow{grid-template-columns:1fr 70px}.mrow .bar{grid-column:1/-1;grid-row:2}}
.share{background:var(--bg2);border:2px dashed var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;display:flex;flex-direction:column;gap:10px}
.share input{flex:1;min-width:160px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:12px 8px;border-radius:14px;border:2px solid var(--line);opacity:.4;filter:grayscale(1)}
.badge.got{opacity:1;filter:none;border-color:var(--gold);background:rgba(255,200,0,.07)}
.badge span{font-size:2rem}.badge small{color:var(--muted);font-size:.72rem}
.settings{display:flex;flex-direction:column;gap:10px}
.settings textarea,.codebox{width:100%;min-height:90px;font-family:"JetBrains Mono",monospace;font-size:.75rem}

/* coach */
.coach{display:flex;flex-direction:column;height:100%}
.coach-head{display:flex;align-items:center;gap:10px}
.pill{font-size:.75rem;font-weight:800;border:2px solid var(--line);padding:3px 10px;border-radius:999px;color:var(--muted)}
.pill.ai{border-color:var(--purple);color:var(--purple)}
.coach-head .btn{margin-left:auto}
.chat{flex:1;min-height:280px;max-height:calc(100dvh - 330px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:8px 2px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.5;font-size:.95rem}
.msg.assistant{background:var(--bg2);border:2px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.user{background:var(--blue);color:#04263a;align-self:flex-end;border-bottom-right-radius:4px;font-weight:700}
.msg.typing{color:var(--muted);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.lesson-link{font-weight:800}
.suggest{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chat-in{display:flex;gap:8px}.chat-in input{flex:1}

/* news */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.news{display:flex;flex-direction:column;gap:12px}
.news-card{background:var(--bg2);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px}
.news-card h3{font-size:1.1rem;margin:6px 0}
.news-card p{margin:6px 0;line-height:1.5;color:#d6e2ea}
.news-meta{display:flex;gap:8px;align-items:center}
.cat{font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:6px;background:var(--line)}
.cat-ipo{background:#6c3fb5}.cat-bankruptcy{background:#a3262a}.cat-earnings{background:#1f6f9e}.cat-m\&a{background:#8a5a00}.cat-central{background:#2e7d32}.cat-markets{background:#455a64}.cat-macro{background:#00695c}
.why{background:rgba(255,200,0,.08);border-left:4px solid var(--gold);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:.92rem;line-height:1.45}
.src{font-weight:700;font-size:.85rem}
.sources{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.source{display:flex;flex-direction:column;background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--text)}
.source span{color:var(--muted);font-size:.8rem}
.source:hover{border-color:var(--blue)}

/* arena */
.arena{max-width:1100px;margin:0 auto}
.arena-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ticker{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:2rem;color:var(--blue)}
.ticker.sm{font-size:1.2rem}
.px{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:1.2rem}
.dayr{font-weight:900;font-family:"JetBrains Mono",monospace}
.chart-wrap{position:relative}
.arena-chart{width:100%;height:min(52vh,460px);display:block;background:var(--bg2);border-radius:14px;border:2px solid var(--line);cursor:crosshair}
.arena-chart.picking{border-color:var(--gold)}
.small-chart{height:260px}
.pick-hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;font-weight:900;padding:4px 12px;border-radius:999px;font-size:.8rem}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.controls .speed{display:flex;gap:4px}
.legend i{display:inline-block;width:14px;height:3px;margin:0 4px 3px 8px;vertical-align:middle}
.panels{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
@media(max-width:760px){.panels{grid-template-columns:1fr}}
.panel{background:var(--bg2);border:2px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;font:inherit;font-weight:900;padding:10px;background:transparent;border:none;color:var(--muted);cursor:pointer}
.seg button.on.long{background:var(--green);color:#0b1a05}.seg button.on.short{background:var(--red);color:#fff}
.frow{display:flex;gap:8px;align-items:flex-end}
.frow label{flex:1;display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.85rem}
.req{color:var(--red);font-size:.7rem;text-transform:uppercase}
.calc{font-size:.9rem;min-height:1.3em}
.pnl{font-family:"JetBrains Mono",monospace;font-size:1.5rem;font-weight:700}
.panel.pos input{width:120px}
.equity{width:100%;height:180px;background:var(--bg2);border:2px solid var(--line);border-radius:14px}
.brief-card{background:var(--bg2);border:2px solid var(--line);border-radius:var(--r);padding:18px}
.brief-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.brief-grid div{display:flex;flex-direction:column}.brief-grid span{font-size:.75rem;color:var(--muted);font-weight:800;text-transform:uppercase}
.brief-grid b{font-family:"JetBrains Mono",monospace;font-size:1.1rem}.brief-grid b.small{font-family:Nunito;font-size:.9rem}
.rules-box{background:rgba(255,75,75,.07);border:2px solid rgba(255,75,75,.4);border-radius:14px;padding:12px 16px;margin-top:12px}
.rules-box ul{margin:6px 0;padding-left:1.2em}
.reveal{background:linear-gradient(135deg,rgba(28,176,246,.15),rgba(206,130,255,.15));border:2px solid var(--blue);border-radius:var(--r);padding:16px;margin-bottom:12px}
.reveal h2{margin:4px 0}
.jcard{background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.jhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.jrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.jrow label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.85rem}

/* toasts & modal */
#toasts{position:fixed;top:calc(14px + var(--safe-t));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;pointer-events:none;align-items:center}
.toast{background:var(--bg2);border:2px solid var(--line);padding:10px 16px;border-radius:14px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .25s;transition:opacity .4s,transform .4s}
.toast.xp{border-color:var(--gold);color:var(--gold)} .toast.level{border-color:var(--purple);color:var(--purple)} .toast.badge{border-color:var(--green);color:var(--green)} .toast.loss{border-color:var(--red);color:var(--red)}
.toast.out{opacity:0;transform:translateY(-10px)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
#modal[hidden],#overlay[hidden]{display:none}
.modal-card{background:var(--bg2);border:2px solid var(--line);border-radius:var(--r);padding:20px;max-width:440px;width:100%;line-height:1.5}
.install-tip{position:fixed;bottom:calc(80px + var(--safe-b));left:50%;transform:translateX(-50%);background:var(--bg2);border:2px solid var(--green);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.4);font-weight:700;max-width:92vw}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay" hidden></div>
<div id="modal" hidden></div>
<div id="toasts"></div>
<noscript>My Trading Bro needs JavaScript to run.</noscript>
<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="js/news.js"></script>
<script src="js/charts.js"></script>
<script src="js/coach.js"></script>
<script src="js/app.js"></script>
<script src="js/arena.js"></script>
<script>
/* Make it an installable app (PWA): offline cache + "Install" button */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredInstall = e;
  if (document.querySelector('.install-tip')) return;
  const tip = document.createElement('div'); tip.className = 'install-tip';
  tip.innerHTML = '📲 Install ' + window.TQ_CONFIG.appName + ' as an app <button class="btn primary sm">Install</button><button class="btn ghost sm">Later</button>';
  const [ok, later] = tip.querySelectorAll('button');
  ok.onclick = async () => { tip.remove(); deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; };
  later.onclick = () => tip.remove();
  document.body.appendChild(tip);
});
</script>
</body>
</html>
